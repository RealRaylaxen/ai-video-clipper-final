name: AI Video Clipper

on:
  repository_dispatch:
    types: [clip_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to process'
        required: true
        type: string
      clip_start:
        description: 'Start time (seconds)'
        required: false
        default: '0'
        type: string
      clip_end:
        description: 'End time (seconds)'
        required: false
        default: '30'
        type: string

jobs:
  clip-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup System FFmpeg Binary
        uses: federicocarboni/setup-ffmpeg@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ffmpeg-python pillow yt-dlp

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Run video clipper
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
          CLIP_START: ${{ github.event.client_payload.clip_start || github.event.inputs.clip_start || '0' }}
          CLIP_END: ${{ github.event.client_payload.clip_end || github.event.inputs.clip_end || '30' }}
        run: |
          # Convert potential empty strings into correct numbers safely
          START_VAL="${CLIP_START:-0}"
          END_VAL="${CLIP_END:-30}"
          
          python main.py \
            --url "$VIDEO_URL" \
            --start "$START_VAL" \
            --end "$END_VAL" \
            --output-dir ./clips

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-clips
          path: ./clips/
          retention-days: 7

      - name: Commit clips artifact
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add clips/
          git diff --staged --quiet || git commit -m "Add video clips [skip ci]" || true
          git push || true
