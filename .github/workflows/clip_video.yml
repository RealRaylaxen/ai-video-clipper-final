name: AI Video Clipper

on:
  repository_dispatch:
    types: [clip_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to process'
        required: true
        type: string
      clip_start:
        description: 'Start time (seconds)'
        required: false
        default: '0'
        type: string
      clip_end:
        description: 'End time (seconds)'
        required: false
        default: '30'
        type: string

jobs:
  clip-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup System FFmpeg Binary
        uses: federicocarboni/setup-ffmpeg@v3

      - name: Setup Node.js Runtime (For YouTube EJS Challenges)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python and JS Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing yt-dlp with [default] ensures the yt-dlp-ejs solver is bundled
          pip install ffmpeg-python pillow "yt-dlp[default]"

      - name: Authenticate YouTube Session
        env:
          COOKIE_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$COOKIE_DATA" ]; then
            mkdir -p ~/.config/yt-dlp
            echo "$COOKIE_DATA" > cookies.txt
            
            # Tell yt-dlp to read cookies AND use our Node runtime for challenges
            echo "--cookies cookies.txt" > ~/.config/yt-dlp/config
            echo "--js-runtimes node" >> ~/.config/yt-dlp/config
            echo "COOKIES_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "COOKIES_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Run video clipper
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.inputs.video_url }}
          CLIP_START: ${{ github.event.client_payload.clip_start || github.inputs.clip_start || '0' }}
          CLIP_ENV: ${{ github.event.client_payload.clip_end || github.inputs.clip_end || '30' }}
        run: |
          START_VAL="${CLIP_START:-0}"
          END_VAL="${CLIP_ENV:-30}"
          
          python main.py \
            --url "$VIDEO_URL" \
            --start "$START_VAL" \
            --end "$END_VAL" \
            --output-dir ./clips
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-clips
          path: ./clips/
          retention-days: 7

      - name: Commit clips artifact
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clips/
          git diff --staged --quiet || git commit -m "Add video clips [skip ci]" || true
          git push || true
